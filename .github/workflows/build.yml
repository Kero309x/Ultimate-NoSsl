name: Cleanup & Build Ultimate-NoSSL

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  audit:
    name: Project Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Project Structure
        run: |
          echo "======================================"
          echo "PROJECT STRUCTURE"
          echo "======================================"
          echo "Top-level files:"
          find . -maxdepth 2 -type f -not -path './.git/*' | sort

      - name: Detect Generated Files
        run: |
          echo "======================================"
          echo "GENERATED / UNWANTED FILE CHECK"
          echo "======================================"
          FOUND=0
          for pattern in ".gradle" ".idea" "*.iml" ".cxx" ".externalNativeBuild" "local.properties" ".DS_Store" "captures"; do
            MATCHES=$(find . -path "./.git" -prune -o -name "$pattern" -print)
            if [ -n "$MATCHES" ]; then
              echo "Found: $pattern -> $MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No unwanted generated files found."
          fi

      - name: Detect Large Files
        run: |
          echo "======================================"
          echo "LARGE FILE CHECK"
          echo "======================================"
          find . -path "./.git" -prune -o -type f -size +10M -print -exec du -h {} \; || true

      - name: Detect Potential Secrets
        run: |
          echo "======================================"
          echo "SECRET CHECK"
          echo "======================================"
          grep -RniE --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle --exclude='*.md' '(api[_-]?key|secret[_-]?key|access[_-]?token|private[_-]?key|password[[:space:]]*=|client[_-]?secret)' . || echo "No secret patterns detected."

      - name: Verify Git Ignore
        run: |
          echo "======================================"
          echo "GITIGNORE CHECK"
          echo "======================================"
          test -f .gitignore
          echo "Root .gitignore:"
          cat .gitignore

      - name: Verify Android Project
        run: |
          echo "======================================"
          echo "ANDROID PROJECT CHECK"
          echo "======================================"
          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -f gradlew
          test -d app
          echo "Android project structure is verified."

  build:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest
    needs: audit

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission
        run: chmod +x ./gradlew

      - name: Validate Gradle
        run: ./gradlew --version

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        run: |
          echo "======================================"
          echo "GENERATED APK"
          echo "======================================"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-NoSSL-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7


